name: Browsers
# Firefox and WebKit (Safari's engine) run the end-to-end suite nightly and on demand; every push
# runs Chromium (ci.yml). docs/web-testing-strategy.md §3.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y npm@11.6.2 ci
      - name: Install backend (end-to-end tests run against the real API)
        working-directory: backend
        run: npm ci && npx prisma generate
      - name: Create roles and databases
        working-directory: backend
        run: psql -v ON_ERROR_STOP=1 -f scripts/db-setup.sql postgresql://postgres:postgres@localhost:5432/postgres
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e -- --project=${{ matrix.browser }}
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: web/test-results
