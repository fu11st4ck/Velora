name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Create roles and databases
        run: psql -v ON_ERROR_STOP=1 -f scripts/db-setup.sql postgresql://postgres:postgres@localhost:5432/postgres
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Lint API contract
        run: npx --yes @redocly/cli@1 lint openapi/openapi.yaml

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t velora-api ./backend
      - run: docker compose config -q
      # The production stack: valid file, and the image it builds starts far enough to check its configuration.
      - run: |
          cd deploy
          cp .env.example .env
          ./generate-secrets.sh >> .env
          sed -i 's#^MAIL_SMTP_URL=$#MAIL_SMTP_URL=smtp://localhost:25#; s#^DOMAIN=.*#DOMAIN=localhost#' .env
          docker compose config -q
          docker compose up -d --build postgres migrate api
          docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
          docker compose exec -T api node dist/maintenance/cli.js check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  mobile-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug -t lib/main_dev.dart

  mobile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign -t lib/main_dev.dart
